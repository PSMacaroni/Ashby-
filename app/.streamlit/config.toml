# App look: light, clinical (white page, one calm blue). Streamlit reads this because it sits next
# to streamlit_app.py. The same colors are in common.py (THEME) for the parts we draw ourselves.

[theme]
base = "light"
primaryColor = "#1F5F8B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#1B1F24"
borderColor = "#D9DEE4"
linkColor = "#1F5F8B"
linkUnderline = false
font = "Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, sans-serif"
codeFont = "Cascadia Mono, SFMono-Regular, Consolas, Menlo, monospace"
baseFontSize = 15
baseRadius = "0.4rem"
buttonRadius = "0.4rem"
showWidgetBorder = true
codeBackgroundColor = "#F4F6F8"
blueColor = "#1F5F8B"
redColor = "#B42318"
yellowColor = "#B54708"
greenColor = "#1E7A4A"

[client]
toolbarMode = "minimal"
showErrorDetails = "full"

[server]
# Only this computer can open the app. Use the number, not "localhost": on some Windows laptops
# "localhost" tries IPv6 first and waits ~0.2 s on every request, which made pages load in ~20 s.
address = "127.0.0.1"
# port: set on the command line (streamlit run ... --server.port 8501); default 8501
headless = true
runOnSave = false
fileWatcherType = "poll"     # notices edited files reliably (also inside OneDrive folders)

[browser]
gatherUsageStats = false
